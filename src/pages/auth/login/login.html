<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Food Store</title>
    <link rel="stylesheet" href="../../../css/login.css">
</head>
<body>
    <div class="container">
        <form id="form-login">
            <h1>Food Store</h1>
            <h2>Iniciar Sesion</h2>

            <label for="email"> Email: </label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="tucorreo@ejemplo.com"
                required>
            
            <label for="password"> Contraseña: </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Mínimo 8 caracteres"
                required>
            <button type="submit">Ingresar</button>

            <p class="registro">
                ¿No tenés cuenta? <a href="../registro/registro.html">Registrate acá</a>
            </p>
        </form>
    </div>
    <script type="module" src="./login.ts"></script>
</body>
</html>
